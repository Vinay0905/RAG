version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cuad_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cuad_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  qdrant_storage:
